name: PhysioOS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Unit/Integration Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build and run tests
      run: mvn -B package

  security-scans:
    name: SAST & Dependency Scans
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - uses: actions/checkout@v4
    
    # Placeholder for SAST (e.g. Semgrep, SonarQube)
    - name: Run SAST Scan (Semgrep)
      run: echo "Running Semgrep..."
      
    # Perform a lightning-fast Trivy filesystem scan for dependencies instead of the slow Maven OWASP plugin
    - name: Run Dependency Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'table'
        exit-code: '0' # Set to 1 to break the build on critical vulnerabilities
        severity: 'CRITICAL,HIGH'

  docker-build:
    name: Build Docker Images & SBOM
    runs-on: ubuntu-latest
    needs: security-scans
    steps:
    - uses: actions/checkout@v4
    
    # Example logic to build images for changed modules. 
    # In reality, you'd use a matrix matrix strategy per service.
    - name: Build Identity Service Image
      run: |
        docker build -f Dockerfile.prod \
          --build-arg JAR_FILE=identity-service/target/identity-service-1.0.0-SNAPSHOT.jar \
          -t physioos/identity-service:latest .
          
    - name: Generate SBOM (Trivy)
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy image --format spdx-json --output sbom.json physioos/identity-service:latest

  deploy-to-k8s:
    name: Deploy to Kubernetes via Helm
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
    - uses: actions/checkout@v4
    
    # Placeholder for actual Kubeconfig setup
    - name: Set up Helm
      uses: azure/setup-helm@v3
      
    - name: Deploy Identity Service
      run: |
        helm upgrade --install identity-service ./k8s/charts/physioos-service \
          --namespace physioos-prod \
          --set image.repository=physioos/identity-service \
          --set image.tag=latest \
          --set service.port=8081
