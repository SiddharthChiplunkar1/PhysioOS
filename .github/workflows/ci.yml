name: PhysioOS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: Build, Scan & Deploy (Dry Run)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build and run tests
      run: mvn -B package

    - name: Run SAST Scan (Semgrep Placeholder)
      run: echo "Running Semgrep..."
      
    - name: Run Dependency Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Build Identity Service Image
      run: |
        docker build -f Dockerfile.prod \
          --build-arg JAR_FILE=identity-service/target/identity-service-1.0.0-SNAPSHOT.jar \
          -t physioos/identity-service:latest .
          
    - name: Generate SBOM (Trivy)
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy image --format spdx-json --output sbom.json physioos/identity-service:latest

    - name: Set up Helm
      uses: azure/setup-helm@v3
      
    - name: Test Kubernetes Deployment (Helm Template Dry-Run)
      run: |
        helm template identity-service ./k8s/charts/physioos-service \
          --namespace physioos-prod \
          --set image.repository=physioos/identity-service \
          --set image.tag=latest \
          --set service.port=8081
