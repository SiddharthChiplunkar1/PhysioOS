server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: clinic-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/clinics/**, /api/organizations/**

        - id: authorization-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/authorization/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}

authorization:
  service:
    url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics